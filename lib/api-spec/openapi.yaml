openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TikTok & YouTube video downloader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: download
    description: Video download operations
  - name: history
    description: User download history
  - name: auth
    description: Authentication
  - name: blog
    description: Blog content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /download/info:
    post:
      operationId: getDownloadInfo
      tags: [download]
      summary: Fetch video metadata for a TikTok or YouTube URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadInfoRequest"
      responses:
        "200":
          description: Video info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoInfo"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not extract info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /download/start:
    post:
      operationId: startDownload
      tags: [download]
      summary: Begin downloading a video and return a job id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDownloadRequest"
      responses:
        "200":
          description: Download ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /download/stats:
    get:
      operationId: getDownloadStats
      tags: [download]
      summary: Aggregate platform-wide download stats (wow endpoint)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadStats"

  /history:
    get:
      operationId: listHistory
      tags: [history]
      summary: List the current user's download history
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: History page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /history/{id}:
    delete:
      operationId: deleteHistoryItem
      tags: [history]
      summary: Delete a single history entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered + signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently signed-in user (or null)
      responses:
        "200":
          description: Current user (may be null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /blog:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List blog posts for SEO
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPostSummary"

  /blog/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a blog post
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
      required: [error, message]

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean }
      required: [success]

    Platform:
      type: string
      enum: [tiktok, youtube]

    Format:
      type: string
      enum: [mp4, mp3]

    DownloadInfoRequest:
      type: object
      properties:
        url: { type: string }
      required: [url]

    VideoFormat:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        quality: { type: string }
      required: [id, label, format, quality]

    VideoInfo:
      type: object
      properties:
        title: { type: string }
        thumbnail: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        uploader: { type: string, nullable: true }
        viewCount: { type: integer, nullable: true }
        likeCount: { type: integer, nullable: true }
        channel: { type: string, nullable: true }
        uploadDate: { type: string, nullable: true }
        description: { type: string, nullable: true }
        platform: { $ref: "#/components/schemas/Platform" }
        formats:
          type: array
          items: { $ref: "#/components/schemas/VideoFormat" }
      required: [title, platform, formats]

    StartDownloadRequest:
      type: object
      properties:
        url: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        quality: { type: string }
      required: [url, format, quality]

    DownloadJob:
      type: object
      properties:
        jobId: { type: string }
        filename: { type: string }
        fileSize: { type: integer }
        title: { type: string, nullable: true }
        thumbnail: { type: string, nullable: true }
        downloadUrl: { type: string }
      required: [jobId, filename, fileSize, downloadUrl]

    DownloadStats:
      type: object
      properties:
        totalDownloads: { type: integer }
        tiktokDownloads: { type: integer }
        youtubeDownloads: { type: integer }
        downloadsToday: { type: integer }
        topFormats:
          type: array
          items:
            type: object
            properties:
              format: { type: string }
              count: { type: integer }
            required: [format, count]
      required: [totalDownloads, tiktokDownloads, youtubeDownloads, downloadsToday, topFormats]

    HistoryItem:
      type: object
      properties:
        id: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        originalUrl: { type: string }
        videoTitle: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        format: { $ref: "#/components/schemas/Format" }
        quality: { type: string, nullable: true }
        fileSize: { type: integer, nullable: true }
        downloadedAt: { type: string }
        status: { type: string }
      required: [id, platform, originalUrl, format, downloadedAt, status]

    HistoryPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      required: [items, total, page, pageSize]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        username: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, email, createdAt]

    MeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [user]

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
      required: [user]

    RegisterRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string, minLength: 6 }
        username: { type: string, nullable: true }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    BlogPostSummary:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        publishedAt: { type: string }
        coverImage: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
      required: [slug, title, excerpt, publishedAt, tags]

    BlogPost:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        publishedAt: { type: string }
        coverImage: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        contentMarkdown: { type: string }
      required: [slug, title, excerpt, publishedAt, tags, contentMarkdown]
